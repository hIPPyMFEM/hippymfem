name: GPU

# The suites and the performance check on a GPU of a self-hosted runner.  Register a runner on
# a machine with a GPU build of PyMFEM (Settings > Actions > Runners) with the labels
# "self-hosted", "linux" and "gpu", and set the repository variables:
#   HIPPYMFEM_GPU_PYTHON   the interpreter that has the CPU PyMFEM, JAX with the GPU plugin, mpi4py
#   HIPPYMFEM_CUDA_PYMFEM  the site-packages of the GPU build of PyMFEM (CUDA or HIP)
#   HIPPYMFEM_GPU_ENV      optional: more variables for the runs, as "A=1 B=2"
# It never runs on pull requests: those from forks would run their code on that machine.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suites:
    name: Suites on a GPU (1 and 2 ranks)
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run the suites
        run: |
          env ${{ vars.HIPPYMFEM_GPU_ENV }} PY="${{ vars.HIPPYMFEM_GPU_PYTHON }}" \
            HIPPYMFEM_CUDA_PYMFEM="${{ vars.HIPPYMFEM_CUDA_PYMFEM }}" ./run_tests.sh 1 2
      - name: Performance against this machine's baseline
        run: |
          if [ -f "benchmarks/perf_baselines/${{ runner.name }}.json" ]; then
            env ${{ vars.HIPPYMFEM_GPU_ENV }} PYTHONPATH="${{ vars.HIPPYMFEM_CUDA_PYMFEM }}" \
              HIPPYMFEM_DEVICE=gpu HIPPYMFEM_HYPRE_DEVICE=1 \
              "${{ vars.HIPPYMFEM_GPU_PYTHON }}" benchmarks/perf_check.py --machine "${{ runner.name }}"
          else
            echo "no baseline for ${{ runner.name }}: record one with benchmarks/perf_check.py --record --machine ${{ runner.name }}"
          fi
